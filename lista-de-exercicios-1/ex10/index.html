
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversor de Algarismos Romanos</title>

  <script src="script.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    input {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      white-space: pre-line;
    }

    .erro {
      color: red;
    }

    .sucesso {
      color: green;
    }
  </style>

</head>

<body>

  <h1>Conversor de Algarismos Romanos</h1>

  <label for="entrada">
    Digite um número decimal ou romano:
  </label>

  <br><br>

  <input
    type="text"
    id="entrada"
    placeholder="Ex.: 1994 ou MCMXCIV"
  >

  <br>

  <button type="button" id="converter">
    Converter
  </button>

  <div id="resultado" aria-live="polite"></div>

</body>

</html>
