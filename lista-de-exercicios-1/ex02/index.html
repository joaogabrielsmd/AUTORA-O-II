<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício N2 – Custo de Viagem Veicular</title>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Exercício N2 – Custo de Viagem Veicular</h1>
  <form id="formulario">
    <label for="entradadist">Distância:</label>
    <input type="text" id="entradadist" inputmode="decimal" required>
     <label for="entradac">Consumo:</label>
    <input type="text" id="entradac" inputmode="decimal" required>
     <label for="entradapreco">Preço/L:</label>
    <input type="text" id="entradapreco" inputmode="decimal" required>
     <label for="entradap">Qtd. Pessoas:</label>
    <input type="text" id="entradap" inputmode="numeric" required>
    <button type="submit" id="processar">Processar</button>
  </form>
  <p id="saida" aria-live="polite"></p>
</body>
</html>
