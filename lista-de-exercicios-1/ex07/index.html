
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora Tabela Price</title>

  <script src="script.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    input {
      padding: 6px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }

    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #ddd;
    }

    #resultado {
      margin-top: 20px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>Calculadora de Financiamento - Tabela Price</h1>

  <label for="valor">Valor financiado (R$):</label>
  <input type="text" id="valor" placeholder="Ex.: 10000,00"
         inputmode="decimal">

  <br><br>

  <label for="taxa">Taxa de juros mensal (%):</label>
  <input type="text" id="taxa" placeholder="Ex.: 2,5"
         inputmode="decimal">

  <br><br>

  <label for="parcelas">Número de parcelas:</label>
  <input type="number" id="parcelas" min="1" step="1"
         placeholder="Ex.: 12">

  <br><br>

  <button id="calcular">Calcular financiamento</button>

  <h2>Resultado</h2>

  <div id="resultado"></div>

  <div id="tabela-container"></div>

</body>
</html>
